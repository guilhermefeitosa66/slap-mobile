<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SLAP Mobile mudou de endereço</title>
<link rel="canonical" href="https://slap.libre-apps.org/entrar/">
<style>:root{color-scheme:light dark}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:34rem;margin:0 auto;padding:4rem 1.25rem;line-height:1.55}
h1{font-size:1.5rem;margin:0 0 1rem}p{margin:0 0 1.5rem}
a.btn{display:inline-block;padding:.75rem 1.25rem;border-radius:.6rem;background:#2563eb;color:#fff;text-decoration:none;font-weight:600}
a.btn:hover{background:#1d4ed8}.url{font-size:.85rem;opacity:.7;word-break:break-all;margin-top:1rem}</style>
</head>
<body>
<h1>Este convite usa o endereço antigo</h1>
<p>O site do SLAP Mobile agora fica em <strong>slap.libre-apps.org</strong>. O convite continua valendo: toque no botão abaixo para abri-lo.</p>
<a class="btn" id="destino" href="https://slap.libre-apps.org/entrar/">Abrir o convite</a>
<p class="url" id="url">https://slap.libre-apps.org/entrar/</p>
<script>
(function () {
  var d = 'https://slap.libre-apps.org/entrar/'+location.search+location.hash;
  document.getElementById('destino').href = d;
  document.getElementById('url').textContent = d;
})();
</script>
</body>
</html>
